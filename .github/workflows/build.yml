name: Build Custom Paintings

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the built JARs as a GitHub Release (main only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      mod_version: ${{ steps.mod_version.outputs.mod_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read mod version
        id: mod_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo 'mod_version is missing from gradle.properties' >&2
            exit 1
          fi
          echo "mod_version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        shell: bash
        run: ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo '## Gradle build diagnostics'
            echo
            echo '```text'
            if [ -f build.log ]; then tail -n 180 build.log; else echo 'Gradle did not produce a build log.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: custompaintings-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    # Publish permanent releases only from version tags or an explicit main-branch dispatch.
    # Ordinary pushes/PRs still produce downloadable CI artifacts.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MOD_VERSION: ${{ needs.build.outputs.mod_version }}
    steps:
      - name: Download built JARs
        uses: actions/download-artifact@v4
        with:
          name: custompaintings-jars
          path: release-assets

      - name: Prepare release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="v${MOD_VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "${tag}" != "v${MOD_VERSION}" ]]; then
              echo "Release tag ${tag} does not match mod_version ${MOD_VERSION}" >&2
              exit 1
            fi
          fi

          mod_jar="release-assets/custompaintings-${MOD_VERSION}.jar"
          sources_jar="release-assets/custompaintings-${MOD_VERSION}-sources.jar"
          if [[ ! -f "$mod_jar" || ! -f "$sources_jar" ]]; then
            echo 'Expected mod JAR and sources JAR were not found in the build artifact.' >&2
            ls -la release-assets >&2 || true
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists. Bump mod_version before publishing another release." >&2
            exit 1
          fi

          {
            echo "Automated release of Custom Paintings ${tag}."
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Minecraft: 26.3"
            echo "- Fabric Loader: 0.19.5"
            echo "- Fabric API: 0.161.0+26.3"
            echo "- Mod Menu: 21.0.0"
            echo "- Java: 25"
            echo
            echo "Install \`custompaintings-${MOD_VERSION}.jar\` into your instance's mods folder."
            echo "The sources JAR is provided for development/reference only."
          } > release-notes.md

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mod_jar=$mod_jar" >> "$GITHUB_OUTPUT"
          echo "sources_jar=$sources_jar" >> "$GITHUB_OUTPUT"

      - name: Publish release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          MOD_JAR: ${{ steps.release.outputs.mod_jar }}
          SOURCES_JAR: ${{ steps.release.outputs.sources_jar }}
        run: |
          set -euo pipefail
          args=(release create "$RELEASE_TAG" --title "Custom Paintings ${RELEASE_TAG}" --notes-file release-notes.md)
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            args+=(--target "${GITHUB_SHA}")
          fi
          gh "${args[@]}" "$MOD_JAR" "$SOURCES_JAR"
