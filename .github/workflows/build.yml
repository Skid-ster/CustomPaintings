name: Build Custom Paintings

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the built JARs as a GitHub Release (main only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      mod_version: ${{ steps.mod_version.outputs.mod_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read mod version
        id: mod_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo 'mod_version is missing from gradle.properties' >&2
            exit 1
          fi
          echo "mod_version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check Java syntax and resource JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet tree-sitter tree-sitter-java
          python3 tools/check_java_syntax.py src
          python3 tools/check_own_api.py
          python3 tools/check_resources.py

      - name: Build and test
        shell: bash
        run: gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo '## Gradle build diagnostics'
            echo
            echo '```text'
            if [ -f build.log ]; then tail -n 180 build.log; else echo 'Gradle did not produce a build log.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload mod JARs
        uses: actions/upload-artifact@v7
        with:
          name: custompaintings-jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  client-gametest:
    name: In-game client rendering test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      SDL_VIDEODRIVER: x11
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install headless rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl1 mesa-vulkan-drivers

      - name: Run Minecraft client gametest
        shell: bash
        run: gradle runClientGameTest --no-daemon --stacktrace 2>&1 | tee client-gametest.log

      - name: Publish client gametest diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo '## Minecraft client gametest diagnostics'
            echo
            echo '```text'
            if [ -f client-gametest.log ]; then tail -n 220 client-gametest.log; else echo 'Gradle did not produce a client gametest log.'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload client gametest evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-evidence
          path: |
            client-gametest.log
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, client-gametest]
    # Successful main builds publish the current version automatically.
    # Version tags and explicit main dispatches are also supported.
    # Existing releases are never overwritten; other branches/PRs only upload CI artifacts.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.publish_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MOD_VERSION: ${{ needs.build.outputs.mod_version }}
    steps:
      - name: Download built JARs
        uses: actions/download-artifact@v8
        with:
          name: custompaintings-jars
          path: release-assets

      - name: Prepare release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="v${MOD_VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ "${tag}" != "v${MOD_VERSION}" ]]; then
              echo "Release tag ${tag} does not match mod_version ${MOD_VERSION}" >&2
              exit 1
            fi
          fi

          mod_jar="release-assets/custompaintings-${MOD_VERSION}.jar"
          sources_jar="release-assets/custompaintings-${MOD_VERSION}-sources.jar"
          if [[ ! -f "$mod_jar" || ! -f "$sources_jar" ]]; then
            echo 'Expected mod JAR and sources JAR were not found in the build artifact.' >&2
            ls -la release-assets >&2 || true
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; skipping publication. Bump mod_version to publish a new release."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          checksums="$(cd release-assets && sha256sum "$(basename "$mod_jar")" "$(basename "$sources_jar")")"
          {
            echo "Automated release of Custom Paintings ${tag}."
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Minecraft: 26.3"
            echo "- Fabric Loader: 0.19.5"
            echo "- Fabric API: 0.161.0+26.3"
            echo "- Mod Menu: 21.0.0"
            echo "- Java: 25"
            echo "- Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Install \`custompaintings-${MOD_VERSION}.jar\` into your instance's mods folder."
            echo "The sources JAR is provided for development/reference only."
            echo
            echo '### SHA-256 checksums'
            echo
            echo '```text'
            echo "$checksums"
            echo '```'
            echo
            echo 'CI compilation, unit tests, and the in-game client rendering regression test passed.'
            echo 'The client test uploads artwork, verifies per-painting textures, exercises the Painting Menu, places a painting, and relogs.'
          } > release-notes.md

          echo 'skip=false' >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mod_jar=$mod_jar" >> "$GITHUB_OUTPUT"
          echo "sources_jar=$sources_jar" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: steps.release.outputs.skip != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          MOD_JAR: ${{ steps.release.outputs.mod_jar }}
          SOURCES_JAR: ${{ steps.release.outputs.sources_jar }}
        run: |
          set -euo pipefail
          args=(release create "$RELEASE_TAG" --title "Custom Paintings ${RELEASE_TAG}" --notes-file release-notes.md)
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            args+=(--target "${GITHUB_SHA}")
          fi
          gh "${args[@]}" "$MOD_JAR" "$SOURCES_JAR"
