plugins {
    // The non-remapping Loom plugin required by unobfuscated Minecraft 26.1+.
    // Do not replace this with the legacy/remapping fabric-loom plugin.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
        content {
            includeGroup 'com.terraformersmc'
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft 26.3 ships with official names; no mappings dependency is needed.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Non-remapping Loom uses standard Gradle dependency configurations.
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Separate client-only source set so regression tests never ship in the release JAR.
// `build` remains headless/unit-test only; CI runs `runClientGameTest` as an explicit in-game job.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'custompaintings-gametest'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = true
    }
}

dependencies {
    gametestImplementation fabricApi.module('fabric-client-gametest-api-v1', project.fabric_api_version)
}

tasks.named('runClientGameTest') {
    // Force the software OpenGL backend in CI; the workflow provides an Xvfb screen with GLX enabled.
    args '--graphicsBackend', 'OPENGL'
    doFirst {
        def runDir = file('build/run/clientGameTest')
        runDir.mkdirs()
        new File(runDir, 'options.txt').text = 'version:4896\npreferredGraphicsBackend:"opengl"\nrenderDistance:2\nsimulationDistance:5\n'
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from('LICENSE.gradle-wrapper') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
